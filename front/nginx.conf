server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Проксируем API на бэкенд-контейнер (имя сервиса из docker-compose.yml).
    # Так фронтенд и бэкенд работают на одном origin и CORS не требуется.
    location /api/ {
        proxy_pass http://back:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html никогда не кэшируется: после деплоя браузер сразу
    # получает страницу с новыми хешами ассетов (иначе — «ничего не изменилось»)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: все маршруты отдаём через index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики с хешами в имени файла
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
