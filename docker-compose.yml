services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: art_classes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d art_classes"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    build: ./back
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/art_classes
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@example.com}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-admin12345}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Фронтенд (React) добавит фронтенд-разработчик:
  # front:
  #   build: ./front
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - back

volumes:
  pgdata:
